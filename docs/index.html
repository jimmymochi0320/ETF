<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股戰情室 - 部署版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #0a0a0a; margin: 0; padding: 0; color: #e5e7eb; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const 代理網址 = "https://api.allorigins.win/get?url=";

        // --- 子組件：圖示 ---
        const Icons = {
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Robot: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
        };

        // --- 圖表組件 ---
        const InteractiveChart = ({ data, isUp, yesterdayClose }) => {
            if (!data || data.length < 2) return <div className="h-48 flex items-center justify-center text-gray-600">數據加載中...</div>;
            const prices = data.map(d => d.price);
            const min = Math.min(...prices, yesterdayClose);
            const max = Math.max(...prices, yesterdayClose);
            const range = max - min || 1;
            const padding = range * 0.15;
            const width = 800;
            const height = 300;
            const getY = (p) => height - ((p - (min - padding)) / (range + padding * 2)) * height;
            const getX = (i) => (i / (data.length - 1)) * width;
            const points = data.map((d, i) => `${getX(i)},${getY(d.price)}`).join(' ');
            const baselineY = getY(yesterdayClose);

            return (
                <div className="bg-[#121212] rounded-lg p-2 mt-4">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-48">
                        <line x1="0" y1={baselineY} x2={width} y2={baselineY} stroke="#374151" strokeDasharray="4" />
                        <polyline fill="none" stroke={isUp ? '#10b981' : '#ef4444'} strokeWidth="3" points={points} />
                    </svg>
                </div>
            );
        };

        // --- 主程式 ---
        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [showSettings, setShowSettings] = useState(!apiKey);
            const [query, setQuery] = useState('');
            const [stock, setStock] = useState(null);
            const [loading, setLoading] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [analysis, setAnalysis] = useState('');

            const saveKey = (key) => {
                localStorage.setItem('gemini_api_key', key);
                setApiKey(key);
                setShowSettings(false);
            };

            const fetchData = useCallback(async (symbol) => {
                if (!symbol) return;
                setLoading(true);
                const target = /^\d{4,5}$/.test(symbol) ? `${symbol}.TW` : symbol.toUpperCase();
                try {
                    const url = `${代理網址}${encodeURIComponent(`https://query2.finance.yahoo.com/v8/finance/chart/${target}?interval=5m&range=1d`)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const payload = JSON.parse(data.contents).chart.result[0];
                    const meta = payload.meta;
                    const history = (payload.timestamp || []).map((t, i) => ({
                        time: new Date(t * 1000).toLocaleTimeString(),
                        price: payload.indicators.quote[0].close[i]
                    })).filter(h => h.price);

                    setStock({
                        symbol: target,
                        price: meta.regularMarketPrice,
                        yesterday: meta.chartPreviousClose,
                        change: (meta.regularMarketPrice - meta.chartPreviousClose).toFixed(2),
                        percent: (((meta.regularMarketPrice - meta.chartPreviousClose) / meta.chartPreviousClose) * 100).toFixed(2) + '%',
                        isUp: meta.regularMarketPrice >= meta.chartPreviousClose,
                        history
                    });
                } catch (e) { alert("找不到該標的"); }
                setLoading(false);
            }, []);

            const runAI = async () => {
                if (!apiKey) return setShowSettings(true);
                setAiLoading(true);
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `請簡短分析股票 ${stock.symbol} 當前價格 ${stock.price} 之趨勢。` }] }] })
                    });
                    const data = await res.json();
                    setAnalysis(data.candidates[0].content.parts[0].text);
                } catch (e) { setAnalysis("AI 呼叫失敗，請檢查金鑰。"); }
                setAiLoading(false);
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    {/* 頂部設定 */}
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-xl font-bold text-emerald-500 tracking-tighter">STOCK TERMINAL</h1>
                        <button onClick={() => setShowSettings(true)} className="p-2 bg-gray-800 rounded-lg"><Icons.Settings /></button>
                    </div>

                    {/* 設定彈窗 */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-6">
                            <div className="bg-[#1a1a1a] p-6 rounded-2xl w-full border border-gray-800">
                                <h2 className="text-lg font-bold mb-4">設定 Gemini API Key</h2>
                                <input 
                                    type="password" 
                                    placeholder="貼上你的 API Key" 
                                    className="w-full bg-black p-3 rounded-xl mb-4 text-sm"
                                    onBlur={(e) => saveKey(e.target.value)}
                                />
                                <p className="text-[10px] text-gray-500">金鑰僅存於您的瀏覽器，不會上傳至伺服器。</p>
                                <button onClick={() => setShowSettings(false)} className="mt-4 text-sm text-gray-400">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* 搜尋欄 */}
                    <div className="flex gap-2 mb-8">
                        <input 
                            className="flex-1 bg-[#1a1a1a] rounded-xl px-4 py-3 text-sm" 
                            placeholder="輸入代號 (例: 2330)" 
                            value={query}
                            onChange={e => setQuery(e.target.value)}
                        />
                        <button onClick={() => fetchData(query)} className="bg-emerald-600 px-6 rounded-xl font-bold text-sm">搜尋</button>
                    </div>

                    {stock && (
                        <div className="animate-in">
                            <div className="flex justify-between items-end mb-4">
                                <div>
                                    <div className="text-3xl font-black">{stock.symbol}</div>
                                    <div className={`text-4xl font-bold ${stock.isUp ? 'text-emerald-400' : 'text-rose-500'}`}>
                                        {stock.price.toFixed(2)}
                                    </div>
                                </div>
                                <div className={`text-right font-bold ${stock.isUp ? 'text-emerald-400' : 'text-rose-500'}`}>
                                    {stock.change} ({stock.percent})
                                </div>
                            </div>

                            <InteractiveChart data={stock.history} isUp={stock.isUp} yesterdayClose={stock.yesterday} />

                            <div className="mt-8 bg-indigo-950/20 border border-indigo-900/40 rounded-2xl p-4">
                                <div className="flex justify-between items-center mb-2">
                                    <div className="flex items-center gap-2 text-indigo-400 font-bold"><Icons.Robot /> AI 診斷</div>
                                    <button onClick={runAI} className="text-[10px] bg-indigo-600 px-2 py-1 rounded-md">獲取建議</button>
                                </div>
                                <div className="text-sm text-gray-400 leading-relaxed">
                                    {aiLoading ? "運算中..." : (analysis || "點擊按鈕獲取 AI 分析")}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
